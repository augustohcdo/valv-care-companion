name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Type-check (strict, src/lib)
        run: npm run typecheck:strict

      # As edge functions rodam em Deno e ficavam fora de toda checagem
      # estática. O primeiro `deno check` da história deste repositório achou
      # sete erros reais, entre eles dois `getClaims` que não existem no SDK
      # resolvido — nos caminhos de autorização do export de LGPD e do backup.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check (edge functions)
        run: npm run typecheck:functions

      - name: Lint
        run: npm run lint

      # O SQL e as migrations ficavam fora de toda checagem automática. São
      # arquivos que ninguém compila: erro de sintaxe neles só aparece quando
      # alguém cola o SQL no painel e a transação aborta no meio.
      #
      # E há um segundo defeito, pior, que este passo fecha: o arquivo que o
      # usuário cola (`scripts/catalogo/aplicar-no-supabase.sql`) é GERADO a
      # partir das migrations. Editar uma migration sem regerar deixava o SQL
      # entregue descrevendo um estado que o repositório não tem mais — e a CI
      # continuava verde, porque nada comparava os dois. O `npm run migrations`
      # roda essa comparação; até agora ela só acontecia se eu lembrasse.
      #
      # `pip install pglast` é obrigatório, não conveniência: sem ele o script
      # sai com 2 = NÃO CONFERIDO, e 2 reprova o passo. A CI nunca fica verde
      # dizendo que conferiu quando não conferiu.
      # `setup-python` em vez do python de sistema: o Ubuntu recente marca o
      # interpretador como externally-managed (PEP 668) e recusa `pip install`.
      # O script chama `python3`, e o setup-python coloca o dele à frente no PATH.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pglast (parser real do PostgreSQL)
        run: pip install pglast

      - name: Migrations (sintaxe, aridade dos INSERT, SQL de aplicação em dia)
        run: npm run migrations

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
