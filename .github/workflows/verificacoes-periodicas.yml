name: Verificações periódicas

# ---------------------------------------------------------------------------
# Por que existe
# ---------------------------------------------------------------------------
#
# O projeto construiu seis verificações sérias e NENHUMA delas rodava sozinha.
# Elas existiam só quando alguém lembrava de digitar o comando:
#
#   · `saude-do-site`      — a porta de entrada do site abre?
#   · `smoke`              — as 62 rotas devolvem o shell do app?
#   · `publicacao`         — 17 conferências do estado publicado contra o banco
#   · `pmids`              — 26 citações continuam apontando para o que dizem
#   · `mmcts`              — 17 links de técnica cirúrgica continuam de pé
#   · `ferramentas:verificar` — três calculadoras dirigidas num navegador de
#     verdade, com o valor da tela conferido contra a fórmula calculada à parte
#
# O custo disso ficou visível do pior jeito: a `turnstile-config` parou de subir,
# o login ficou FECHADO para todo mundo — captcha não carrega, botão Entrar
# desabilitado — e ninguém soube. A CI estava verde (ela confere o código, não o
# que está no ar) e o `smoke` também estaria: as rotas devolviam o shell
# normalmente, a tela abria bonita, só não dava para entrar. Quem descobriu foi
# uma pessoa tentando usar o site.
#
# Verificação que depende de alguém lembrar é verificação que não existe.
#
# ---------------------------------------------------------------------------
# Por que NÃO CONFERIDO também reprova
# ---------------------------------------------------------------------------
#
# Os scripts deste projeto usam 0 = ok, 1 = errado, 2 = NÃO CONFERIDO. É
# tentador deixar o 2 passar verde, para a execução diária não ficar vermelha
# quando o PubMed estiver fora do ar. Mas essa é exatamente a mentira que este
# repositório inteiro persegue: dizer "está tudo bem" sobre o que não se olhou.
#
# Então o 2 também reprova — e a tabela do resumo diz, em cada linha, se foi
# DIVERGE ou NÃO CONFERIDO. Quem abrir sabe na primeira olhada se o site
# quebrou ou se a fonte estava fora do ar. As duas coisas merecem um olhar; só
# uma delas é urgente.
#
# ---------------------------------------------------------------------------
# Segredos
# ---------------------------------------------------------------------------
#
# Nenhum. A URL do projeto e a chave publishable saem do `.env` versionado, e as
# duas são públicas por construção — a chave vai embutida em todo bundle que
# qualquer visitante baixa; quem protege os dados é a RLS. Este workflow não
# toca em `SUPABASE_ACCESS_TOKEN` nem em `SUPABASE_SERVICE_ROLE_KEY`, e não deve
# passar a tocar: ele roda sozinho, todo dia, sem ninguém olhando.

on:
  schedule:
    # 09:17 UTC ≈ 06:17 em Brasília. Minuto quebrado de propósito: a hora cheia
    # é quando todo mundo agenda, e o GitHub atrasa ou descarta execução nesses
    # picos.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Para abrir/atualizar a issue de falha — ver o último passo. Um vigia diário
  # que falha em silêncio não é vigia: estas conferências reprovaram SEIS dias
  # seguidos sem que ninguém soubesse, porque nada avisa e ninguém abre a aba
  # de Actions todo dia. O resumo é ótimo para quem já está olhando; a issue é
  # para quem não está.
  issues: write

concurrency:
  group: verificacoes-periodicas
  cancel-in-progress: false

jobs:
  conferir:
    name: O que está no ar ainda funciona?
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      # ------------------------------------------------------------------
      # As chaves PÚBLICAS, e os dois erros que esta etapa já teve.
      #
      # **Erro 1 — a fonte.** A versão anterior lia o `.env` do checkout, com
      # um comentário meu afirmando "o `.env` é versionado". Ele NÃO é: a linha
      # 16 do `.gitignore` o exclui. Na CI o arquivo nunca existiu, e o passo
      # morria em `grep: .env: No such file or directory`. **Seis execuções
      # agendadas, seis falhas, nenhuma conferência realizada** — e a lição
      # estava escrita por mim no `vitest.config.ts`, em cima: "O CI não tem
      # `.env`, e a máquina de quem desenvolve tem".
      #
      # A chave publicável é pública de verdade — vai embutida em todo bundle
      # que qualquer visitante baixa —, então mora em `vars`, não em `secrets`.
      # Sem `vars` configurado, o `.env` local ainda serve (execução por `act`).
      #
      # **Erro 2, o pior — o portão de dois estados.** O passo terminava com
      # `exit 1` quando não achava as chaves. Só que o passo `Conferir`, abaixo,
      # implementa TRÊS estados (ok / diverge / não conferido) e o
      # `conferir-publicacao.mjs` já sai 2 sozinho quando falta a chave. O
      # `exit 1` matava o job antes disso: as CINCO conferências que não
      # precisam de chave nenhuma — porta de entrada, rotas do site, PubMed,
      # MMCTS, calculadoras — não rodaram uma única vez.
      #
      # Falta de credencial é "não conferido", não "está errado". Quem decide
      # isso é cada conferência, com o próprio código de saída.
      # ------------------------------------------------------------------
      - name: Exportar as chaves públicas
        env:
          URL_DE_VARS: ${{ vars.VITE_SUPABASE_URL }}
          CHAVE_DE_VARS: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -o pipefail
          if [ -n "$URL_DE_VARS" ] && [ -n "$CHAVE_DE_VARS" ]; then
            {
              echo "VITE_SUPABASE_URL=$URL_DE_VARS"
              echo "VITE_SUPABASE_PUBLISHABLE_KEY=$CHAVE_DE_VARS"
            } >> "$GITHUB_ENV"
            echo "Chaves públicas vindas das variáveis do repositório."
            exit 0
          fi

          if [ -f .env ]; then
            grep -E '^VITE_SUPABASE_(URL|PUBLISHABLE_KEY)=' .env \
              | tr -d '"' >> "$GITHUB_ENV"
            quantas=$(grep -cE '^VITE_SUPABASE_(URL|PUBLISHABLE_KEY)=' .env || true)
            echo "Chaves públicas vindas do .env local: $quantas de 2."
            exit 0
          fi

          # Sem chave, e SEM matar o job. As conferências que dependem dela
          # sairão 2 (NÃO CONFERIDO) por conta própria, e as outras cinco
          # rodam normalmente — que é o ponto inteiro da convenção de três
          # estados.
          echo "::warning::sem VITE_SUPABASE_URL/PUBLISHABLE_KEY (nem em vars, nem em .env)."
          echo "::warning::as conferências que falam com o banco sairão NÃO CONFERIDO; as demais rodam."
          {
            echo "### ⚠️ Chaves públicas ausentes"
            echo ""
            echo "As conferências que falam com o banco sairão **NÃO CONFERIDO**."
            echo "Para ligá-las, defina em *Settings → Secrets and variables → Actions → Variables*:"
            echo ""
            echo "- \`VITE_SUPABASE_URL\`"
            echo "- \`VITE_SUPABASE_PUBLISHABLE_KEY\`"
            echo ""
            echo "São chaves **públicas** — já vão embutidas no bundle que qualquer visitante baixa."
            echo "Por isso `variables`, e nunca `secrets`."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # A checagem mais barata e a mais importante vem primeiro, sozinha e sem
      # depender de build nenhum: se a porta de entrada estiver fechada, quem
      # abrir este resumo precisa ver isso na primeira linha.
      - name: A porta de entrada do site abre?
        run: node scripts/saude-do-site.mjs

      - name: Build
        run: npm run build

      - name: Servir o build
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then
              echo "preview de pé"; exit 0
            fi
            sleep 1
          done
          echo "::error::o preview não respondeu em 30s"
          cat /tmp/preview.log
          exit 1

      # `--no-save`: o Playwright não é dependência do projeto e não deve virar
      # uma. Mesmo raciocínio do `rotas-autenticadas.yml` — obrigar todo mundo a
      # baixar navegador no `npm ci` seria cobrar de muitos o custo de poucos.
      - name: Instalar o Playwright
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      # Um passo só para TODAS as conferências, de propósito: passo que falha
      # encerra o job, e conferências em passos separados esconderiam tudo que
      # vem depois da primeira que quebrar. Aqui cada uma roda até o fim e a
      # tabela mostra o conjunto.
      - name: Conferir
        env:
          SMOKE_BASE_URL: https://valvepath.com.br
        run: |
          diverge=0
          naoConferido=0

          # Tabela e detalhes vão para arquivos separados e só no fim se juntam.
          # Escrevendo direto no resumo, o primeiro `<details>` caía NO MEIO da
          # tabela e cortava as linhas seguintes — conferido rodando o bloco
          # antes de publicar este arquivo.
          : > /tmp/tabela.md
          : > /tmp/detalhes.md

          roda() {
            rotulo="$1"; shift
            if "$@" > "/tmp/saida.log" 2>&1; then
              estado=0
            else
              estado=$?
            fi
            case "$estado" in
              0) echo "| $rotulo | ✅ ok |" >> /tmp/tabela.md ;;
              2) echo "| $rotulo | ⚠️ NÃO CONFERIDO |" >> /tmp/tabela.md
                 naoConferido=1 ;;
              *) echo "| $rotulo | ❌ DIVERGE (saída $estado) |" >> /tmp/tabela.md
                 diverge=1 ;;
            esac
            if [ "$estado" -ne 0 ]; then
              {
                echo ""
                echo "<details><summary>$rotulo — saída</summary>"
                echo ""
                echo '```'
                tail -40 /tmp/saida.log
                echo '```'
                echo "</details>"
              } >> /tmp/detalhes.md
            fi
            echo "── $rotulo → $estado"
            tail -20 /tmp/saida.log
          }

          roda "Porta de entrada (turnstile-config)" node scripts/saude-do-site.mjs
          roda "Rotas do site publicado (smoke)"     npm run smoke
          roda "Estado publicado (publicacao)"       npm run publicacao
          roda "Citações PubMed (pmids)"             npm run pmids
          roda "Links MMCTS (mmcts)"                 npm run mmcts
          roda "Calculadoras no navegador"           node scripts/ferramentas-verificar.mjs http://127.0.0.1:4173

          {
            echo "## Verificações periódicas"
            echo ""
            echo "| Verificação | Estado |"
            echo "| --- | --- |"
            cat /tmp/tabela.md
            echo ""
            cat /tmp/detalhes.md
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$diverge" -ne 0 ]; then
            echo "> ❌ **Alguma coisa DIVERGE.** O que está no ar não é o que o repositório diz." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$naoConferido" -ne 0 ]; then
            echo "> ⚠️ **Alguma coisa ficou NÃO CONFERIDA** — fonte fora do ar, rede, credencial ausente." >> "$GITHUB_STEP_SUMMARY"
            echo "> Não é divergência: é ausência de resposta. Reprova porque \"não sei\" não é \"está tudo bem\"." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$diverge" -eq 0 ] && [ "$naoConferido" -eq 0 ]; then
            # Conta a partir da tabela, e não um número escrito à mão: número
            # cravado em texto envelhece calado quando a lista muda, e aí o
            # resumo passa a afirmar uma quantidade que ninguém conferiu.
            echo "> ✅ As $(wc -l < /tmp/tabela.md) conferências passaram." >> "$GITHUB_STEP_SUMMARY"
          fi

          [ "$diverge" -eq 0 ] && [ "$naoConferido" -eq 0 ]

      # ------------------------------------------------------------------
      # O aviso que faltava.
      #
      # `$GITHUB_STEP_SUMMARY` só existe para quem abre a execução. Estas
      # conferências falharam nos dias 14, 15, 16, 17, 18 e 19 de setembro e a
      # primeira pessoa a notar foi quem foi procurar — seis dias depois.
      #
      # Uma issue ABERTA aparece na página inicial do repositório e chega por
      # e-mail a quem acompanha. Reaproveita a mesma issue em vez de abrir uma
      # por dia: uma pilha de seis issues idênticas é outro jeito de não avisar.
      # E FECHA sozinha quando volta a passar, para a issue aberta significar
      # sempre "está quebrado agora", e não "esteve quebrado um dia".
      # ------------------------------------------------------------------
      - name: Avisar (ou desavisar) por issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const TITULO = "🔴 Verificações periódicas falhando";
            const falhou = ${{ job.status == 'failure' }};
            const link = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const abertas = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "verificacoes-periodicas", per_page: 10,
            });
            const existente = abertas.data.find((i) => i.title === TITULO) ?? null;

            if (falhou) {
              const corpo = [
                "As verificações periódicas do que está no ar reprovaram.",
                "",
                `Execução: ${link}`,
                "",
                "A tabela com o estado de cada conferência está no resumo da execução.",
                "Três estados, e os dois últimos reprovam por motivos diferentes:",
                "",
                "- ✅ **ok** — conferido e bate;",
                "- ❌ **DIVERGE** — o que está no ar não é o que o repositório diz;",
                "- ⚠️ **NÃO CONFERIDO** — não deu para olhar (fonte fora do ar, credencial ausente).",
                "  Não é divergência: é ausência de resposta. Reprova porque \"não sei\" não é \"está tudo bem\".",
                "",
                "Esta issue fecha sozinha na primeira execução que passar.",
              ].join("\n");

              if (existente) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: existente.number,
                  body: `Reprovou de novo.\n\nExecução: ${link}`,
                });
                core.notice(`Falha registrada na issue #${existente.number}.`);
              } else {
                const nova = await github.rest.issues.create({
                  ...context.repo, title: TITULO, body: corpo, labels: ["verificacoes-periodicas"],
                });
                core.notice(`Falha registrada na issue #${nova.data.number}.`);
              }
              return;
            }

            // Passou. Se havia issue aberta, ela deixa de valer AGORA — issue
            // que fica aberta depois de consertado ensina a ignorar issue.
            if (existente) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existente.number,
                body: `Voltou a passar.\n\nExecução: ${link}`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: existente.number, state: "closed",
              });
              core.notice(`Issue #${existente.number} fechada: as conferências voltaram a passar.`);
            }
