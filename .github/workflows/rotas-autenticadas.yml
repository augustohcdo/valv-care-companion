name: Rotas autenticadas

# ---------------------------------------------------------------------------
# Por que existe
# ---------------------------------------------------------------------------
#
# 39 das 61 rotas do app ficam sob `/app/` e, sem sessão, todas param no login.
# Quer dizer que dá para quebrar qualquer uma delas com a CI verde: os testes
# cobrem componentes isolados, o `smoke` confere o shell — que é o MESMO
# `index.html` para as 61 — e o `rotas-renderizam` sem sessão relata, com
# honestidade, 39 redirecionamentos.
#
# Nenhuma dessas telas é aberta por nada automático hoje. Este workflow abre.
#
# ---------------------------------------------------------------------------
# Por que semanal, e não a cada push
# ---------------------------------------------------------------------------
#
# Porque ele cria uma conta capaz de entrar na base de PRODUÇÃO. É pouca coisa
# — conta sem vínculo nenhum, que a RLS deixa ver nada, viva por alguns minutos
# — mas é uma porta, e porta se abre de propósito, não a cada `git push`.
#
# Só que "de propósito" virou "quando alguém lembra", e essas 39 telas passaram
# semanas sem ninguém abrir. Foi decisão do dono do projeto passar a semanal: uma
# vez por semana a porta abre sozinha, o que é frequência baixa o bastante para
# a exposição continuar pequena e alta o bastante para a conferência existir.
#
# ---------------------------------------------------------------------------
# O que muda quando ninguém está olhando
# ---------------------------------------------------------------------------
#
# O `if: always()` do passo de remoção bastava enquanto havia uma pessoa vendo o
# resultado. Ele cobre falha de passo — não cobre runner morto, job cancelado
# pela infraestrutura, nem falha do próprio passo de remoção. Cada um desses
# deixa uma conta de produção de pé, e, sem ninguém olhando, ela fica de pé para
# sempre enquanto a semana seguinte cria outra: vazamento lento e invisível.
#
# Daí o último passo, `--varrer-restos`, que procura contas de verificação de
# execuções ANTERIORES e as apaga. Ele reprova quando acha alguma — achar resto
# significa que uma remoção falhou, e isso precisa aparecer mesmo depois de
# consertado. Vem por último, e não primeiro, justamente para não cancelar a
# varredura das telas quando encontra algo.
#
# ---------------------------------------------------------------------------
# O que este workflow NÃO cobre, de propósito
# ---------------------------------------------------------------------------
#
# As rotas de `/app/admin/*`. Elas exigem o papel `admin`, e conceder papel
# privilegiado em produção para varrer tela é troca ruim: o vigia deste projeto
# dispara alerta por qualquer concessão dessas nas últimas 24h, justamente
# porque quem tem o papel lê o backup inteiro e edita a base que a IA cita como
# diretriz. Ficam sem cobertura, e isso aparece no resumo em vez de ser
# resolvido por um atalho.
#
# ---------------------------------------------------------------------------
# Matriz, e não um job com um laço
# ---------------------------------------------------------------------------
#
# Um job por tipo de conta, porque cada um precisa do SEU passo de remoção com
# `if: always()`. Num laço dentro de um job só, a falha da varredura do primeiro
# tipo pularia a remoção da conta dele.

on:
  schedule:
    # Domingo, 07:23 UTC ≈ 04:23 em Brasília — fora do horário em que alguém
    # estaria usando o site, e num minuto quebrado porque a hora cheia é quando
    # todo mundo agenda e o GitHub atrasa ou descarta execução nesses picos.
    - cron: "23 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rotas-autenticadas
  cancel-in-progress: false

jobs:
  varrer:
    name: Varrer as rotas como ${{ matrix.tipo }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tipo: medico
            prova: /app/medico
          - tipo: paciente
            prova: /app/paciente
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recusar sem as credenciais
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          faltou=0
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN (usado para ler a chave pública e conferir a remoção por SQL)."
            faltou=1
          fi
          if [ -z "$SERVICE" ]; then
            echo "::error::Falta o segredo SUPABASE_SERVICE_ROLE_KEY (usado para CRIAR e APAGAR a conta temporária pela API de administração)."
            echo "::error::Cadastre em Settings → Secrets and variables → Actions."
            faltou=1
          fi
          # Recusar aqui, e não deixar falhar adiante: sem esta parada, a
          # ausência do segredo apareceria como um 403 da API de gestão, e a
          # conclusão provável seria "problema do Supabase" em vez de "falta
          # cadastrar o segredo". Foi o que aconteceu na primeira execução.
          [ "$faltou" = 0 ] || exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # O bundle precisa da URL do projeto e da chave pública, senão o cliente
      # não resolve sessão nenhuma e a varredura morreria com erro obscuro. As
      # duas vêm da API de gestão: são públicas por construção (a chave vai
      # embutida em todo bundle que qualquer visitante baixa; quem protege os
      # dados é a RLS), então não há segredo novo a cadastrar.
      - name: Montar o .env do build
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/conta-de-verificacao.mjs --env-do-build --saida .env

      - name: Build
        run: npm run build

      - name: Servir o build
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then
              echo "preview de pé"; exit 0
            fi
            sleep 1
          done
          echo "::error::o preview não respondeu em 30s"
          cat /tmp/preview.log
          exit 1

      # `--no-save`: o Playwright não é dependência do projeto e não deve virar
      # uma. Este workflow é ocasional e manual; obrigar todo mundo a baixar
      # navegador no `npm ci` por causa dele seria cobrar de muitos o custo de
      # poucos. O script resolve o import por `node_modules`, que é onde isto cai.
      - name: Instalar o Playwright
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      # A conta nasce aqui. O id vai para /tmp/sessao.json.id ANTES de qualquer
      # conferência, para o passo de remoção achá-la mesmo se este passo falhar
      # no meio.
      # A `service_role` entra AQUI e no passo de remoção, e em lugar nenhum
      # mais. Ela NÃO pode chegar ao passo de build: o Vite embute no bundle
      # tudo que tenha prefixo `VITE_`, e um deslize ali publicaria a chave que
      # ignora toda a RLS em cada visita ao site. O `.env` do build é montado
      # com a chave PÚBLICA, que é pública por construção.
      - name: Criar a conta temporária
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/conta-de-verificacao.mjs \
            --criar --tipo "${{ matrix.tipo }}" --saida /tmp/sessao.json

      # A sessão entra por variável de ambiente e não passa por log nenhum. O
      # `add-mask` é cinto e suspensório: o script não imprime o token, mas se
      # algum dia imprimir, sai mascarado.
      - name: Varrer as rotas
        env:
          ROTAS_SUPABASE_URL: https://qwiojyfxzvdcfbbexyxg.supabase.co
          ROTAS_PROVA: ${{ matrix.prova }}
        run: |
          # `pipefail`, e não é detalhe de estilo: o GitHub roda os passos com
          # `bash -e`, sem ele. Numa cadeia `node … | tee …` o bash devolve o
          # status do ÚLTIMO comando — o `tee`, que sempre dá 0. Sem esta linha,
          # a varredura podia sair 1 (rota quebrada) ou 2 (não conferido) e o
          # passo ficava VERDE assim mesmo.
          #
          # É o defeito que este workflow inteiro existe para caçar, dentro dele
          # próprio: sucesso relatado sem o trabalho ter dado certo. Achado
          # relendo o log da primeira execução bem sucedida, porque 16 segundos
          # para 61 rotas me pareceu rápido demais — e era só a CI sendo rápida,
          # mas a dúvida valeu o achado.
          set -o pipefail
          echo "::add-mask::$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/sessao.json","utf8")).access_token)')"
          ROTAS_SESSAO="$(cat /tmp/sessao.json)" \
            node scripts/rotas-renderizam.mjs http://127.0.0.1:4173 \
            | tee /tmp/rotas-${{ matrix.tipo }}.log

      # ------------------------------------------------------------------
      # A cerca de `doctors`, provada pelo caminho do usuário
      # ------------------------------------------------------------------
      #
      # A migration de setembro trocou o `using (true)` de `doctors` por uma
      # cerca de cinco portas, e isso foi provado numa bancada PostgreSQL 16 —
      # réplica das tabelas, das políticas e dos dados. Bancada prova que o SQL
      # faz o que diz; não prova que o SQL que faz isso é o que está rodando.
      #
      # Este passo fecha a distância pelo caminho do usuário: a sessão que já
      # existe aqui, contra o PostgREST de produção, com a chave PÚBLICA. A
      # `service_role` NÃO entra: ela ignora toda a RLS e leria tudo por
      # construção, o que tornaria a conferência sem sentido — seria medir a
      # própria chave, não a cerca.
      #
      # `always()`: a cerca é independente da varredura de rotas, e perdê-la
      # porque uma tela quebrou seria deixar de conferir o que dá para conferir.
      # Sem sessão o script sai 2, que é a verdade do caso.
      #
      # ## Só a perna do PACIENTE, e o motivo é mensurável
      #
      # A conta de verificação do tipo `medico` nasce SEM CRM nos metadados, e
      # `handle_new_user` só cria a linha de `doctors`
      # `IF v_account_type = 'medico' AND v_meta->>'crm' IS NOT NULL`. Ela não
      # tem registro profissional, então ler 0 linhas é o estado CORRETO dela — e
      # a porta 1 da cerca ("a própria linha") fica sem ser exercida.
      #
      # Rodar a conferência ali daria NÃO CONFERIDO em toda execução, e guarda
      # permanentemente amarela ensina a ignorar guarda. A porta 1 segue coberta
      # pela bancada e por `MedicoPerfil.test.tsx`.
      #
      # O dia em que a conta de verificação passar a nascer com CRM, o teste
      # `cercaDeDoctors.test.ts` reprova e manda tirar esta restrição — a guarda
      # aponta para a melhoria em vez de escondê-la.
      - name: Conferir a cerca de doctors
        if: always() && matrix.tipo == 'paciente'
        env:
          ROTAS_SUPABASE_URL: https://qwiojyfxzvdcfbbexyxg.supabase.co
        run: |
          set -o pipefail
          if [ ! -f /tmp/sessao.json ]; then
            echo "NÃO CONFERIDO: não há sessão nesta execução — nada a conferir."
            exit 2
          fi
          # A chave sai do `.env` que o build já montou. `add-mask` porque ela
          # é pública mas log é copiado sem contexto, e porque este é o padrão
          # que o passo da sessão acima já segue.
          chave=$(grep '^VITE_SUPABASE_PUBLISHABLE_KEY=' .env | cut -d= -f2-)
          if [ -z "$chave" ]; then
            echo "NÃO CONFERIDO: o .env do build não tem a chave pública."
            exit 2
          fi
          echo "::add-mask::$chave"
          ROTAS_SESSAO="$(cat /tmp/sessao.json)" \
            VITE_SUPABASE_PUBLISHABLE_KEY="$chave" \
            node scripts/cercaDeDoctors.mjs --tipo "${{ matrix.tipo }}" \
            | tee /tmp/cerca-${{ matrix.tipo }}.log

      # `always()`: é este passo que impede a conta de sobrar de pé na produção
      # quando algo acima falha — que é justamente quando ninguém está olhando.
      # O script confere a remoção em vez de confiar no 200 do DELETE.
      - name: Apagar a conta temporária
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ ! -f /tmp/sessao.json.id ]; then
            echo "Nenhuma conta foi criada nesta execução — nada a apagar."
            exit 0
          fi
          node scripts/conta-de-verificacao.mjs \
            --apagar --id "$(cat /tmp/sessao.json.id)"

      # Só o relatório. O arquivo da sessão NUNCA vira artefato.
      - name: Guardar o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotas-${{ matrix.tipo }}
          path: /tmp/rotas-${{ matrix.tipo }}.log
          if-no-files-found: ignore

      - name: Resumo
        if: always()
        run: |
          echo "## Rotas abertas como \`${{ matrix.tipo }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -s "/tmp/rotas-${{ matrix.tipo }}.log" ]; then
            tail -40 "/tmp/rotas-${{ matrix.tipo }}.log" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "(a varredura não chegou a produzir relatório)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '> As rotas de `/app/admin/*` ficam fora: exigem papel privilegiado, e' >> "$GITHUB_STEP_SUMMARY"
          echo '> concedê-lo em produção para varrer tela é troca ruim.' >> "$GITHUB_STEP_SUMMARY"

      # POR ÚLTIMO, e com `always()`.
      #
      # Por último porque ele REPROVA quando acha resto, e reprovar antes
      # cancelaria a varredura das 39 telas — trocar a conferência da semana pela
      # limpeza seria perder a razão de o workflow existir.
      #
      # Com `always()` porque o caso que mais interessa é justamente aquele em
      # que algo acima falhou.
      #
      # A janela de 3 horas do script é o que impede o job do `medico` de apagar
      # a conta que o job do `paciente` acabou de criar: a matriz roda os dois em
      # paralelo, e sem a janela um sabotaria o outro.
      - name: Sobrou conta de alguma execução anterior?
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/conta-de-verificacao.mjs --varrer-restos

  # ------------------------------------------------------------------------
  # As fontes do catálogo ainda resolvem?
  #
  # A conferência diária tinha uma linha chamada "catálogo: nenhuma EOA gravada
  # sem fonte citável", e o que ela media era se o CAMPO estava preenchido. Uma
  # URL que devolve 404 passava por citável.
  #
  # Não é defeito hipotético: o cabeçalho do `conferir-mmcts.mjs` registra
  # "links da Corcym que devolviam 404 depois de o site ser reorganizado". São
  # 82 URLs únicas, em 16 domínios, quase todas de fabricante — e quem clica é
  # um cardiologista conferindo a procedência da área efetiva de orifício que
  # ele usa para escolher tamanho de prótese.
  #
  # Job separado, e SEMANAL: são 82 requisições a sites de terceiros. Diário
  # seria incômodo para eles e inútil para nós — link de fabricante apodrece em
  # reorganização de site, que acontece em meses.
  #
  # Só a chave PÚBLICA, pela ação composta. Este job não recebe
  # `SUPABASE_ACCESS_TOKEN`: ele não precisa, e o token é root sobre a conta.
  # ------------------------------------------------------------------------
  fontes:
    name: Fontes do catálogo ainda resolvem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Exportar as chaves públicas
        uses: ./.github/actions/chaves-publicas
        with:
          url-de-vars: ${{ vars.VITE_SUPABASE_URL }}
          chave-de-vars: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # Sem `npm ci`: o script usa só `fetch` do Node. Instalar 900 pacotes para
      # bater em 82 URLs seria gastar minuto de runner por nada.
      - name: Conferir as fontes
        run: node scripts/conferir-fontes.mjs

  # ------------------------------------------------------------------------
  # O aviso que faltava — e por que ele é um job separado.
  #
  # Esta varredura roda aos domingos e reportava SÓ no `$GITHUB_STEP_SUMMARY`,
  # que só existe para quem abre a execução. É o mesmo defeito que a agenda
  # diária teve, e o cabeçalho dela registra o custo: as conferências falharam
  # nos dias 14, 15, 16, 17, 18 e 19 de setembro, e a primeira pessoa a notar
  # foi quem foi procurar — seis dias depois.
  #
  # Aqui o intervalo é SEMANAL, então o mesmo silêncio custa sete dias por
  # repetição em vez de um.
  #
  # Job separado com `needs` porque a varredura é uma matriz de dois: o aviso
  # precisa ver as DUAS pernas antes de decidir, e um passo dentro de cada
  # perna veria só a sua.
  #
  # A decisão reusa `avisoPorIssue.mjs`, o mesmo módulo da agenda diária — ele é
  # puro e tem teste. Título e etiqueta são DIFERENTES de propósito: com os
  # mesmos, uma agenda fecharia a issue aberta pela outra, e o sinal mais
  # valioso desta base ("issue aberta = está quebrado agora") viraria ruído.
  # ------------------------------------------------------------------------
  avisar:
    name: Avisar se a varredura reprovou
    needs: [varrer, fontes]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Avisar (ou desavisar) por issue
        uses: actions/github-script@v7
        with:
          script: |
            const {
              decidirAviso, corpoDaIssue, textoDoComentario,
            } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/avisoPorIssue.mjs`);

            const TITULO = "🔴 Varredura semanal das rotas autenticadas falhando";
            const ETIQUETA = "rotas-autenticadas";
            const link = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // A assinatura, job por job. `needs.*.result` só dá o agregado, e
            // agregado não distingue "o médico quebrou" de "as fontes do
            // catálogo morreram" — que é justamente a informação que faz o
            // comentário valer a pena. Os jobs da própria execução dão o resto.
            //
            // TODO job que não é este entra, e isso é de propósito: a primeira
            // versão filtrava por `name.startsWith("Varrer as rotas como ")`, e
            // quando o job das fontes do catálogo foi acrescentado ele ficaria
            // FORA da assinatura e da tabela — o aviso dispararia (porque
            // `needs` o inclui) sem dizer o que quebrou. Filtro por nome
            // envelhece a cada job novo; a negativa não.
            const EU = "Avisar se a varredura reprovou";
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { ...context.repo, run_id: context.runId, per_page: 50 },
            );
            const pernas = jobs
              .filter((j) => j.name !== EU)
              .map((j) => ({
                rotulo: j.name,
                // `success` → 0 e `skipped` → 2, para a assinatura falar a
                // mesma língua da agenda diária: 0 ok, 2 não conferido, resto
                // diverge. Job pulado não é job que passou — é job que não
                // rodou, e "não sei" não é "está tudo bem".
                estado: j.conclusion === "success" ? "0"
                  : j.conclusion === "skipped" ? "2" : j.conclusion,
              }))
              .sort((a, b) => a.rotulo.localeCompare(b.rotulo));

            // Sem pernas não há veredito, e inventar conjunto vazio pareceria
            // "tudo passou" — a mesma decisão que a agenda diária tomou para a
            // assinatura ausente.
            const assinatura = pernas.length
              ? pernas.map((p) => `${p.rotulo}=${p.estado}`).join("\n")
              : "(não achei as pernas da matriz nesta execução)";
            const tabela = pernas
              .map((p) => `| ${p.rotulo} | ${
                p.estado === "0" ? "✅ ok" : p.estado === "2" ? "⚠️ NÃO CONFERIDO (pulado)" : `❌ ${p.estado}`
              } |`)
              .join("\n");

            // Derivado dos jobs, e não de `needs.*.result`: um job novo entra
            // na conta sozinho. A condição escrita à mão é o que fez a primeira
            // versão desta linha olhar só a matriz.
            const falhou = pernas.some((p) => p.estado !== "0");

            const abertas = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: ETIQUETA, per_page: 10,
            });
            const achada = abertas.data.find((i) => i.title === TITULO) ?? null;
            const issue = achada ? { number: achada.number, body: achada.body } : null;

            const texto = {
              intro: "A varredura semanal das rotas autenticadas reprovou.",
              agenda: "Esta varredura roda aos domingos, em `main`",
              periodo: "domingo",
            };
            const decisao = decidirAviso({ falhou, assinatura, issue });
            const corpo = corpoDaIssue({
              assinatura, link, tabela, texto,
              ramo: context.payload?.ref ?? context.ref ?? null,
              evento: context.eventName ?? null,
            });

            switch (decisao.acao) {
              case "nada":
                core.notice("Passou, e não havia issue aberta.");
                break;
              case "criar": {
                const nova = await github.rest.issues.create({
                  ...context.repo, title: TITULO, body: corpo, labels: [ETIQUETA],
                });
                core.notice(`Falha registrada na issue #${nova.data.number}.`);
                break;
              }
              case "atualizar":
                await github.rest.issues.update({
                  ...context.repo, issue_number: decisao.numero, body: corpo,
                });
                core.notice(
                  `Issue #${decisao.numero}: mesmo conjunto de vereditos do domingo anterior — ` +
                  "corpo atualizado, sem comentário novo.",
                );
                break;
              // Espelha a agenda diária de propósito, inclusive no detalhe de
              // `decisao` já carregar `mudancas` e `primeiraVez`: montar os
              // argumentos à mão aqui seria a segunda forma de chamar a mesma
              // função, e é assim que duas cópias começam a divergir.
              case "comentar":
                await github.rest.issues.update({
                  ...context.repo, issue_number: decisao.numero, body: corpo,
                });
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: decisao.numero,
                  body: textoDoComentario({ ...decisao, link }),
                });
                core.notice(decisao.primeiraVez
                  ? `Issue #${decisao.numero}: sem assinatura anterior para comparar — ` +
                    "comentei uma vez e expliquei o silêncio que vem depois."
                  : `Issue #${decisao.numero}: o conjunto de vereditos mudou.`);
                break;
              case "fechar":
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: decisao.numero,
                  body: `Voltou a passar. Fechando.\n\nExecução: ${link}`,
                });
                await github.rest.issues.update({
                  ...context.repo, issue_number: decisao.numero, state: "closed",
                });
                core.notice(`Issue #${decisao.numero} fechada: voltou a passar.`);
                break;
            }
