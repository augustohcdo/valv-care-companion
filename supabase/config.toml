project_id = "qwiojyfxzvdcfbbexyxg"

# Functions below don't authenticate via a Supabase-issued user JWT — they use
# their own scheme (hospital API key, cron secret, public pre-auth token) — so
# the platform-level JWT gate must be disabled for them. Every one of these
# still enforces its own auth check in code (see supabase/functions/<name>/index.ts).
# Functions not listed here keep the default verify_jwt = true.
[functions.fhir-read]
verify_jwt = false

[functions.fhir-ingest]
verify_jwt = false

[functions.turnstile-config]
verify_jwt = false

# Semear a base de trechos era a última ação manual que sobrava para o usuário —
# abrir a tela de administração e clicar. Ele pediu para não precisar, e a saída
# é a mesma das outras aqui: o pg_cron chama a função com um segredo de
# `internal_secrets`. Para o segredo chegar ao código, a plataforma não pode
# barrar antes; a função continua exigindo esse segredo OU um JWT de admin, e o
# caminho do admin não mudou.
[functions.knowledge-seed]
verify_jwt = false

[functions.weekly-export]
verify_jwt = false

[functions.weekly-digest]
verify_jwt = false

[functions.job-watchdog]
verify_jwt = false

[functions.report-error]
verify_jwt = false

[functions.welcome-email]
verify_jwt = false

[functions.admin-digest]
verify_jwt = false

[functions.offsite-copy]
verify_jwt = false

[functions.access-request]
verify_jwt = false

# As que exigem JWT — escrito, e não herdado do padrão.
#
# O comentário no alto diz que function fora desta lista "mantém o default
# verify_jwt = true", e é verdade: medido em produção em 2026-10-15, as seis
# abaixo devolvem 401 sem credencial. Mas o alcance destas seis — conversa
# clínica, encerramento de conta, exportação de LGPD, decisão de acesso,
# emissão de chave de hospital e ingestão da base de conhecimento — fica melhor
# escrito aqui do que dependendo do padrão de uma ferramenta de terceiro, que
# pode mudar de versão sem nos avisar e sem aparecer em teste nenhum.
#
# E o comentário do workflow de deploy afirmava que era o config que mantinha a
# `clinical-ai` exigindo JWT. Ela não estava aqui. Agora está.
[functions.clinical-ai]
verify_jwt = true

[functions.account-close]
verify_jwt = true

[functions.dpo-export]
verify_jwt = true

[functions.access-decide]
verify_jwt = true

[functions.hospital-api-key-create]
verify_jwt = true

[functions.knowledge-ingest]
verify_jwt = true
